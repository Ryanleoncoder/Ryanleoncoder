name: Update GitHub Metrics

on:
  schedule:
    # Runs automatically every day at 06:00 UTC — no push needed
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger from Actions tab anytime

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Dynamic SVGs (Public + Private Repos)
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_metrics.py

      - name: Commit & Push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics/*.svg
          git diff --cached --quiet || git commit -m "chore: update dynamic GitHub metrics SVGs [skip ci]"
          git push
